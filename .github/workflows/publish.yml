# Publishes pytest-socket to PyPI on a published GitHub Release.
# Auth is Trusted Publishing (OIDC), so there's no API token in the repo.
# Setup: https://docs.pypi.org/trusted-publishers/

name: Publish 📦 to PyPI

on:
  release:
    types: [published]

# Queue, never cancel: interrupting a publish mid-run risks a half-released state.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false # avoid cache poisoning on a publish workflow
      - name: Build a source tarball and a wheel
        run: uv build
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-to-pypi:
    name: Publish 📦 to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pytest-socket/${{ github.event.release.tag_name }}
    permissions:
      id-token: write # IMPORTANT: mandatory for Trusted Publishing
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
